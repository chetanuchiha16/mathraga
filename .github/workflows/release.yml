name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty to use v<version> from package.json)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Determine Release Tag & Version
        id: vars
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v$APP_VERSION"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag will be: $TAG_NAME"

      - name: Check for Custom Signing Keystore
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Custom signing keystore found in repository secrets."
            echo "$SIGNING_KEY_BASE64" | base64 -d > release.keystore
            echo "CUSTOM_SIGNING=true" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=$KEYSTORE_PASS_SECRET" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> $GITHUB_ENV
            echo "KEY_PASS=${KEY_PASS_SECRET:-$KEYSTORE_PASS_SECRET}" >> $GITHUB_ENV
          else
            echo "No custom signing keystore provided. Using standard signed release APK."
            echo "CUSTOM_SIGNING=false" >> $GITHUB_ENV
          fi
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage & Verify APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK from Gradle: $APK_FILE"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS"

          if [ "$CUSTOM_SIGNING" = "true" ]; then
            echo "Signing APK with custom production keystore..."
            # Strip default debug signature
            zip -d "$APK_FILE" "META-INF/*" || true
            # Align before signing
            $BUILD_TOOLS/zipalign -f -p 4 "$APK_FILE" aligned.apk
            # Sign with custom keystore
            $BUILD_TOOLS/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASS" \
              --key-pass pass:"$KEY_PASS" \
              --out mathraga.apk aligned.apk
          else
            echo "Using default signed release APK..."
            cp "$APK_FILE" mathraga.apk
          fi

          echo "Verifying APK signature..."
          $BUILD_TOOLS/apksigner verify --verbose mathraga.apk
          cp mathraga.apk "mathraga-${{ steps.vars.outputs.tag }}.apk"
          echo "APK staging successful: mathraga.apk and mathraga-${{ steps.vars.outputs.tag }}.apk ready"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathraga-apk
          path: mathraga.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Mathraga ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            mathraga.apk
            mathraga-${{ steps.vars.outputs.tag }}.apk

      - name: Clean sensitive files
        if: always()
        run: |
          rm -f release.keystore aligned.apk

